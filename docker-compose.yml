services:
  mongo:
    image: mongo:7
    container_name: tejadev-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tejadev-api
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - '8000:8000'
    environment:
      API_PORT: ${API_PORT:-8000}
      NODE_ENV: ${NODE_ENV:-dev}
      DB_URL: ${DB_URL:-mongodb://mongo:27017/tejadev}
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tejadev-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-dev}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-TejaDev Web}

volumes:
  mongo-data:
